; SNES ROMs, played with SNEmulDS.
; The snes handler picks the TGDS build or a legacy build, as described in launchPlanner.cpp.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=virtual-console
HANDLER=snes
LAUNCHER_PATH=/_nds/TWiLightMenu/emulators/SNEmulDS.nds
LAUNCHER_PATH_TWL=/_nds/TWiLightMenu/emulators/SNEmulDS.srl
LAUNCHER_PATH_LEGACY=/_nds/TWiLightMenu/emulators/SNEmulDS-legacy.nds
LAUNCHER_PATH_LEGACY_TWLM=/_nds/TWiLightMenu/emulators/SNEmulDS-legacy-twlm-path.nds
ICON=snes
