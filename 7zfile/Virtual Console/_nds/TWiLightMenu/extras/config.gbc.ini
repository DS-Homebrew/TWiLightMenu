; Game Boy Color ROMs, played with GameYob.
; DS_MODE -1 switches to DS mode when TWiLight Menu++ is not in DSi mode.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=virtual-console
HANDLER=direct
LAUNCHER_PATH=/_nds/TWiLightMenu/emulators/gameyob.nds
DS_MODE=-1
ICON=gbc
