; Game Boy Advance ROMs.
; The gba handler uses a Slot-2 cart with the native GBA setting, GBARunner3 when present,
; or the GBARunner2 build for the console, as described in launchPlanner.cpp.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=base
HANDLER=gba
LAUNCHER_PATH_NATIVE=fat:/_nds/TWiLightMenu/gbapatcher.srldr
LAUNCHER_PATH_GBAR3=/_nds/TWiLightMenu/emulators/GBARunner3.nds
LAUNCHER_PATH_DSI=/_nds/GBARunner2_arm7dldi_dsi.nds
LAUNCHER_PATH_3DS=/_nds/GBARunner2_arm7dldi_3ds.nds
LAUNCHER_PATH_DSI_NODSP=/_nds/GBARunner2_arm7dldi_nodsp_dsi.nds
LAUNCHER_PATH_3DS_NODSP=/_nds/GBARunner2_arm7dldi_nodsp_3ds.nds
LAUNCHER_PATH_DS_ARM7=/_nds/GBARunner2_arm7dldi_ds.nds
LAUNCHER_PATH_DS_ARM9=/_nds/GBARunner2_arm9dldi_ds.nds
LAUNCHER_PATH_DS_ARM7_ROM3M=/_nds/GBARunner2_arm7dldi_rom3m_ds.nds
LAUNCHER_PATH_DS_ARM9_ROM3M=/_nds/GBARunner2_arm9dldi_rom3m_ds.nds
ICON=gba
