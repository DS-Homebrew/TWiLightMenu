; DSTWO plugins, booted by the DSTWO firmware. Only listed with a DSTWO as the Slot-1 flashcard.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=base
HANDLER=dstwo-plugin
LAUNCHER_PATH=fat:/_nds/TWiLightMenu/bootplg.srldr
DS_MODE=1
BOOST_VRAM=0
NTR_SD_RELAUNCH=0
LIST_IF=dstwo
ICON=plg
