; GIF images, shown with TWiLight Menu++'s image viewer.
; The image viewer reads the file from ROM_PATH in settings.ini rather than its arguments,
; and doesn't need the DS-mode relaunch to reach SD.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=multimedia
HANDLER=direct
LAUNCHER_PATH=/_nds/TWiLightMenu/imageview.srldr
RESOLVE=boot-device
NTR_SD_RELAUNCH=0
ICON=img
