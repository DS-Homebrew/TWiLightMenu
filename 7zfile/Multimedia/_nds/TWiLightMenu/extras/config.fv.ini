; FastVideo files, played with FastVideoDS.
; The fastvideo handler picks FastVideoDS32 for 32 KB DLDI drivers.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=multimedia
HANDLER=fastvideo
LAUNCHER_PATH=/_nds/TWiLightMenu/apps/FastVideoDS.nds
LAUNCHER_PATH_DLDI32=/_nds/TWiLightMenu/apps/FastVideoDS32.nds
ICON=vid
