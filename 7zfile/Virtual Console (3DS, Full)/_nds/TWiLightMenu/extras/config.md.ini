; Sega Mega Drive ROMs, played with jEnesisDSPlus or PicoDrive TWL. Listed on a flashcard only with PicoDrive TWL chosen.
; The genesis handler follows the Mega Drive emulator setting, as described in launchPlanner.cpp.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=virtual-console
HANDLER=genesis
LAUNCHER_PATH=/_nds/TWiLightMenu/emulators/jEnesisDSPlus.nds
LAUNCHER_PATH_MACRO=/_nds/TWiLightMenu/emulators/jEnesisDSPlus_macro.nds
LAUNCHER_PATH_PICO=/_nds/TWiLightMenu/emulators/PicoDriveTWL.nds
LIST_IF=picodrive
ICON=md
