; ColecoVision ROMs, played with S8DS or ColecoDS as chosen in Settings.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=virtual-console
HANDLER=s8ds-colecods
SETTING=col
LAUNCHER_PATH=/_nds/TWiLightMenu/emulators/S8DS.nds
LAUNCHER_PATH_COLECODS=/_nds/TWiLightMenu/emulators/ColecoDS.nds
DATA_DIRS=data/s8ds
ICON=col
