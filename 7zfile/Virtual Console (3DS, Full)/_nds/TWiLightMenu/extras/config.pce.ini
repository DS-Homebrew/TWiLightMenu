; PC Engine/TurboGrafx-16 ROMs, played with NitroGrafx.
; The pce handler boots it through nds-bootstrap-hb with the ROM in RAM when Settings' SMS/GG in RAM option is on.
; See universal/include/common/customLaunchers.h for every key.
[LAUNCHER]
ADDON=virtual-console
HANDLER=pce
LAUNCHER_PATH=/_nds/TWiLightMenu/emulators/NitroGrafx.nds
DATA_DIRS=data/NitroGrafx
ICON=pce
